# nginx: лендинг практикума, чистая статика.
# Лежит на сервере в /etc/nginx/sites-available/, сайт — /var/www/course.skorehood.com
# Сертификат Let's Encrypt, продление — certbot.timer (проверка через /.well-known на :80).

server {
    listen 80;
    listen [::]:80;
    server_name course.skorehood.com;
    root /var/www/course.skorehood.com;

    # Продление сертификата идёт по http — не уводить на https
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://course.skorehood.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name course.skorehood.com;

    ssl_certificate     /etc/letsencrypt/live/course.skorehood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/course.skorehood.com/privkey.pem;
    include snippets/ssl-common.conf;

    root /var/www/course.skorehood.com;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Служебное репозитория наружу не отдаём
    location ~ /\.(?!well-known) { deny all; }
    location = /CNAME { deny all; }

    # Как на GitHub Pages: /conditions -> /conditions/ (301), затем index.html
    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
